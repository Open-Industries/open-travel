# disruption-risk-scorer — Knative Service: scale to zero.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: disruption-risk-scorer
  namespace: travel
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "20"
    spec:
      containers:
        - image: quay.io/open-industries/disruption-risk-scorer:latest  # replaced by the promoted release digest
          ports: [{ containerPort: 8080 }]
          env:
            - { name: HTTP_PORT, value: "8080" }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
