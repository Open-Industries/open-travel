openapi: 3.1.0
info:
  title: Open Travel — Reference Travel Core Platform — aggregate contract
  version: 1.0.0
  description: >
    Aggregate view of the platform's public REST contracts. The normative per-service
    contracts are generated from code by Quarkus SmallRye OpenAPI at `/openapi` on each
    service; CI diffs them against this file (see docs/api/api-standards.md).
    Conventions: RFC 9457 errors, Idempotency-Key on creates, lifecycle transitions
    take no body, explicit units on every quantity, all data synthetic.
servers:
  - url: https://api.example.org/api/v1
    description: Production (per adopter)
security:
  - bearerAuth: []
paths:
  /bookings:
    post:
      operationId: create-booking
      summary: "Booking registry; the PNR is masked at creation and never kept in clear."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /fare-holds:
    post:
      operationId: create-fare
      summary: "Guarded fare holds per booking and the charges against them."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /offer-rules:
    post:
      operationId: create-offers
      summary: "Decision rules binding cabin classes to discount and stopover envelopes."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /travel-properties:
    post:
      operationId: create-hotel
      summary: "Travel property catalogue (hotels, resorts, apartments, hostels)."
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
  /notifications:
    post:
      operationId: dispatch-notification
      summary: Dispatch a notification
      responses:
        '202': { description: Accepted }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            type: object
            required: [type, title, status]
            properties:
              type: { type: string }
              title: { type: string }
              status: { type: integer }
              detail: { type: string }
